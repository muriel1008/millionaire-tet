<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú - Savills Tet Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle, #001f3f 0%, #000b18 100%);
            color: white;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .game-container {
            flex-grow: 1;
            display: flex;
            padding: 20px;
        }

        .main-stage {
            flex: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border-left: 2px solid #00d4ff;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .question-box {
            background: linear-gradient(180deg, #002c5f 0%, #001a38 100%);
            border: 2px solid #00d4ff;
            border-radius: 50px;
            padding: 20px 40px;
            width: 90%;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            box-shadow: 0 0 15px #00d4ff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90%;
        }

        .option-btn {
            background: linear-gradient(180deg, #002c5f 0%, #001a38 100%);
            border: 2px solid #00d4ff;
            border-radius: 30px;
            padding: 15px;
            color: white;
            text-align: left;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .option-btn:hover {
            background: #e67e22;
            border-color: #fff;
        }

        .option-btn.correct {
            background: #27ae60 !important;
        }

        .option-btn.wrong {
            background: #c0392b !important;
        }

        .option-btn.selected {
            background: #f1c40f !important;
            color: #000;
        }

        .ladder-item {
            padding: 5px 15px;
            margin: 2px 0;
            border-radius: 5px;
            font-weight: bold;
            color: #bdc3c7;
        }

        .ladder-item.active {
            background: #e67e22;
            color: white;
        }

        .ladder-item.milestone {
            color: white;
            border-bottom: 1px solid #555;
        }

        .lifelines {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .lifeline-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            background: #002c5f;
        }

        .lifeline-circle.used {
            opacity: 0.3;
            text-decoration: line-through;
            cursor: not-allowed;
        }

        .prize-display {
            font-size: 2rem;
            color: #f1c40f;
            text-shadow: 0 0 10px #f1c40f;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">SAVILLS TET EDITION: AI LÀ TRIỆU PHÚ</span>
        <div>
            <button class="btn btn-outline-warning" onclick="walkAway()">Walk Away</button>
            <button class="btn btn-outline-danger" onclick="resetGame()">Next Contestant</button>
        </div>
    </nav>

    <div class="game-container">

            <div class="lifelines">
                <div id="ll-50" class="lifeline-circle" onclick="use5050()">50:50</div>
                <div id="ll-call" class="lifeline-circle" onclick="useCall()">☎</div>
                <div id="ll-audience" class="lifeline-circle" onclick="useAudience()">👥</div>
            </div>

            <div id="prize-zone" class="prize-display">Đang chuẩn bị...</div>

            <div class="question-box" id="question-text">
                Bấm "Bắt đầu" để mời thí sinh lên ghế nóng!
            </div>

            <div class="options-grid" id="options-container">
                <!-- Options will appear here -->
            </div>

            <div class="mt-4">
                <button id="start-btn" class="btn btn-primary btn-lg" onclick="startGame()">BẮT ĐẦU CHƠI</button>
                <button id="next-btn" class="btn btn-success btn-lg" onclick="proceedNext()" style="display:none;">TIẾP THEO →</button>
            </div>
        </div>

        <div class="sidebar" id="ladder">
            <!-- Prize ladder will be generated here -->
        </div>
    </div>

        };

        function getQuestionsFromPool(poolName, count) {
            // Refill if empty or not enough
            if (availableIndices[poolName].length < count) {
                availableIndices[poolName] = Array.from(
                    { length: questionPools[poolName].length },
                    (_, i) => i
                );
                shuffle(availableIndices[poolName]);
                console.log(`Refilled ${poolName} pool.`);
            }

            // Pick indices and remove them
            const pickedIndices = availableIndices[poolName].splice(0, count);
            return pickedIndices.map(idx => questionPools[poolName][idx]);
        }

        function renderLadder() {
            const ladder = document.getElementById('ladder');
            ladder.innerHTML = '';
            for (let i = prizes.length - 1; i >= 1; i--) {
                const div = document.createElement('div');
                div.className = `ladder-item ${i === currentIndex ? 'active' : ''} ${i % 5 === 0 ? 'milestone' : ''}`;
                div.innerText = `${i}. ${prizes[i]}`;
                ladder.appendChild(div);
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startGame() {
            // Pick 5 from each pool without immediate reuse
            const easy = getQuestionsFromPool('easy', 5);
            const medium = getQuestionsFromPool('medium', 5);
            const hard = getQuestionsFromPool('hard', 5);

            currentQuestions = [...easy, ...medium, ...hard];
            currentIndex = 1;
            usedLifelines = { f50: false, call: false, aud: false };
            updateLifelineUI();
            showQuestion();
            document.getElementById('start-btn').style.display = 'none';
        }

        function showQuestion() {
            renderLadder();
            const qData = currentQuestions[currentIndex - 1];
            document.getElementById('question-text').innerText = `Câu ${currentIndex}: ${qData.q}`;
            document.getElementById('prize-zone').innerText = `Giải thưởng hiện tại: ${prizes[currentIndex]}`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            qData.a.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + idx)}:</strong> ${opt}`;
                btn.onclick = () => selectOption(idx, btn);
                container.appendChild(btn);
            });
        }

        function selectOption(idx, btn) {
            const qData = currentQuestions[currentIndex - 1];
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.onclick = null); // Disable further clicks

            btn.classList.add('selected');

            setTimeout(() => {
                const nextBtn = document.getElementById('next-btn');
                if (idx === qData.c) {
                    btn.classList.remove('selected');
                    btn.classList.add('correct');
                    lastAnswerCorrect = true;
                    nextBtn.innerText = (currentIndex === 15) ? 'TUYÊN BỐ TRIỆU PHÚ 🏆' : 'TIẾP THEO →';
                    nextBtn.className = 'btn btn-success btn-lg';
                } else {
                    btn.classList.remove('selected');
                    btn.classList.add('wrong');
                    allBtns[qData.c].classList.add('correct');
                    lastAnswerCorrect = false;
                    nextBtn.innerText = 'MỜI THÍ SINH KẾ TIẾP →';
                    nextBtn.className = 'btn btn-danger btn-lg';
                }
                nextBtn.style.display = 'inline-block';
            }, 1500);
        }

        function proceedNext() {
            document.getElementById('next-btn').style.display = 'none';
            if (lastAnswerCorrect) {
                if (currentIndex === 15) {
                    alert("CHÚC MỪNG! BẠN LÀ TRIỆU PHÚ TET! TRÒ CHƠI KẾT THÚC.");
                    location.reload();
                } else {
                    currentIndex++;
                    showQuestion();
                }
            } else {
                alert("Rất tiếc! Trò chơi kết thúc cho bạn. Mời thí sinh tiếp theo.");
                resetGame();
            }
        }

        function resetGame() {
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('question-text').innerText = 'Mời thí sinh tiếp theo...';
            document.getElementById('options-container').innerHTML = '';
            currentIndex = 0;
            renderLadder();
        }

        function walkAway() {
            alert(`Bạn đã dừng lại với phần thưởng: ${prizes[currentIndex - 1]}. Chúc mừng!`);
            resetGame();
        }

        // Lifelines
        function use5050() {
            if (usedLifelines.f50 || currentIndex === 0) return;
            usedLifelines.f50 = true;
            updateLifelineUI();
            const qData = currentQuestions[currentIndex - 1];
            const btns = document.querySelectorAll('.option-btn');
            let removed = 0;
            let indices = [0, 1, 2, 3].filter(i => i !== qData.c);
            shuffle(indices);
            indices.slice(0, 2).forEach(i => {
                btns[i].innerText = '';
                btns[i].onclick = null;
            });
        }

        function useCall() {
            if (usedLifelines.call || currentIndex === 0) return;
            usedLifelines.call = true;
            updateLifelineUI();
            alert("Đang kết nối với người thân... 'Tôi nghĩ đáp án là " + String.fromCharCode(65 + currentQuestions[currentIndex - 1].c) + "... chắc vậy!'");
        }

        function useAudience() {
            if (usedLifelines.aud || currentIndex === 0) return;
            usedLifelines.aud = true;
            updateLifelineUI();
            alert("Khán giả đang bình chọn... [Thanh chat đang bùng nổ!]");
        }

        function updateLifelineUI() {
            if (usedLifelines.f50) document.getElementById('ll-50').classList.add('used');
            else document.getElementById('ll-50').classList.remove('used');
            if (usedLifelines.call) document.getElementById('ll-call').classList.add('used');
            else document.getElementById('ll-call').classList.remove('used');
            if (usedLifelines.aud) document.getElementById('ll-audience').classList.add('used');
            else document.getElementById('ll-audience').classList.remove('used');
        }

        renderLadder();
    </script>
</body>

</html>
